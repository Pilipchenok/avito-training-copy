openapi: 3.0.3
info:
  title: Avito.Kitchen MVP API
  description: API сервиса доставки еды и интеграции с заведениями
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local development server

paths:
  /client/restaurants:
    get:
      summary: Получить список активных ресторанов
      tags: [Client]
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Restaurant'

  /client/restaurants/{restaurant_id}/menu:
    get:
      summary: Получить меню ресторана
      tags: [Client]
      parameters:
        - name: restaurant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Список позиций меню
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuItem'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /client/orders:
    post:
      summary: Создать заказ
      tags: [Client]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Заказ успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '409':
          description: Одно или несколько блюд недоступны
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /client/orders/{order_id}:
    get:
      summary: Получить статус заказа
      tags: [Client]
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFoundError'


  /partner/restaurants/{restaurant_id}/menu/{item_id}/availability:
    put:
      summary: Изменить доступность позиции в меню
      tags: [Partner]
      parameters:
        - name: restaurant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: item_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_available]
              properties:
                is_available:
                  type: boolean
      responses:
        '200':
          description: Статус блюда успешно обновлен
        '404':
          $ref: '#/components/responses/NotFoundError'

  /partner/orders/{order_id}/status:
    patch:
      summary: Обновить статус заказа рестораном
      tags: [Partner]
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: Статус заказа обновлен
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'

components:
  schemas:
    Restaurant:
      type: object
      required: [id, name, is_active]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Додо Пицца"
        webhook_url:
          type: string
          example: "http://restaurant:8081/webhook/orders"
        is_active:
          type: boolean

    MenuItem:
      type: object
      required: [id, restaurant_id, name, price, is_available]
      properties:
        id:
          type: string
          format: uuid
        restaurant_id:
          type: string
          format: uuid
        name:
          type: string
          example: "Пепперони"
        description:
          type: string
          example: "Острая колбаса чоризо, сыр моцарелла"
        price:
          type: integer
          example: 590
        is_available:
          type: boolean

    OrderStatus:
      type: string
      enum: [CREATED, COOKING, READY, CANCELLED]

    OrderItemRequest:
      type: object
      required: [menu_item_id, quantity]
      properties:
        menu_item_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          example: 2

    CreateOrderRequest:
      type: object
      required: [restaurant_id, items, delivery_address]
      properties:
        restaurant_id:
          type: string
          format: uuid
        delivery_address:
          type: string
          example: "ул. Ленина, д. 10, кв. 25"
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItemRequest'

    OrderItem:
      type: object
      required: [id, menu_item_id, name, price, quantity]
      properties:
        id:
          type: string
          format: uuid
        menu_item_id:
          type: string
          format: uuid
        name:
          type: string
        price:
          type: integer
        quantity:
          type: integer

    Order:
      type: object
      required: [id, restaurant_id, status, total_price, delivery_address, items, created_at]
      properties:
        id:
          type: string
          format: uuid
        restaurant_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/OrderStatus'
        total_price:
          type: integer
          example: 1180
        delivery_address:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        created_at:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: "ITEM_UNAVAILABLE"
        message:
          type: string
          example: "Товар временно отсутствует в заведении"

  responses:
    NotFoundError:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequestError:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
